<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sand Paintings — Nikkat Afrin</title>
<meta name="description" content="12 sand and acrylic paintings by Nikkat Afrin.">
<meta property="og:title" content="Sand Paintings — Nikkat Afrin">
<meta property="og:description" content="12 sand and acrylic paintings by Nikkat Afrin.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d;--panel:rgba(14,20,42,.55);--panel-solid:#0b1022;
  --line:rgba(120,160,255,.16);--line-hi:rgba(34,211,238,.45);
  --txt:#dbe6f5;--dim:#8fa3c4;--faint:#5e719a;
  --cy:#22d3ee;--vi:#a78bfa;--star:#eaf4ff;
  --grad:linear-gradient(100deg,#22d3ee 0%,#818cf8 45%,#e879f9 100%);
  --max:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Space Grotesk',-apple-system,Segoe UI,sans-serif;
  line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.neb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:drift 26s ease-in-out infinite alternate}
.neb1{width:620px;height:620px;top:-190px;left:-150px;background:radial-gradient(circle,#4c1d95,transparent 68%)}
.neb2{width:540px;height:540px;top:38%;right:-190px;background:radial-gradient(circle,#0e7490,transparent 68%);animation-delay:-9s}
.neb3{width:500px;height:500px;bottom:-160px;left:30%;background:radial-gradient(circle,#701a75,transparent 68%);animation-delay:-16s}
@keyframes drift{to{transform:translate3d(48px,-38px,0) scale(1.1)}}
.wrap{position:relative;z-index:2}
nav{position:fixed;top:0;left:0;right:0;z-index:60;backdrop-filter:blur(16px);
  background:rgba(4,5,13,.82);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--max);margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:26px}
.brand{font-weight:700;letter-spacing:.14em;background:var(--grad);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-decoration:none;font-size:1rem;white-space:nowrap}
.nav-links{margin-left:auto;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.nav-links a{color:var(--dim);text-decoration:none;font-size:.85rem;transition:color .25s;white-space:nowrap}
.nav-links a:hover,.nav-links a.on{color:var(--cy)}
header.hd{max-width:var(--max);margin:0 auto;padding:132px 26px 34px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.73rem;letter-spacing:.32em;color:var(--cy);
  text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:11px}
.eyebrow::before{content:'';width:26px;height:1px;background:var(--cy)}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-bottom:14px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--dim);max-width:660px;font-size:1.03rem}
.count{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--faint);margin-top:16px}
main{max-width:var(--max);margin:0 auto;padding:12px 26px 90px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:13px}
.gitem{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;
  background:var(--panel-solid);aspect-ratio:1;transition:.3s;display:block}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.22,1,.36,1)}
.gitem:hover{border-color:var(--line-hi);transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.5)}
.gitem:hover img{transform:scale(1.08)}
.gitem:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:200;background:rgba(3,4,10,.95);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:26px}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:84vh;border-radius:12px;border:1px solid var(--line-hi);
  box-shadow:0 24px 70px rgba(0,0,0,.7)}
.lb-x,.lb-p,.lb-n{position:absolute;background:rgba(12,18,38,.8);border:1px solid var(--line);
  color:var(--star);width:46px;height:46px;border-radius:50%;font-size:1.3rem;cursor:pointer;
  display:grid;place-items:center;transition:.25s}
.lb-x:hover,.lb-p:hover,.lb-n:hover{border-color:var(--cy);color:var(--cy)}
.lb-x{top:22px;right:22px} .lb-p{left:22px} .lb-n{right:22px}
.lb-c{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--dim)}
.back{display:inline-flex;align-items:center;gap:9px;margin-top:30px;padding:12px 24px;border-radius:100px;
  border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:.9rem;font-weight:600;transition:.28s}
.back:hover{border-color:var(--line-hi);color:var(--cy)}
footer{border-top:1px solid var(--line);padding:32px 26px;text-align:center;color:var(--faint);font-size:.83rem}
@media(max-width:640px){.gal{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:9px}
  header.hd{padding-top:112px} .lb-p{left:8px} .lb-n{right:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"><div class="neb neb1"></div><div class="neb neb2"></div><div class="neb neb3"></div></div>
<div class="wrap">
<nav><div class="nav-in">
  <a href="../" class="brand">NIKKAT AFRIN</a>
  <div class="nav-links">
    <a href="../">← Portfolio</a>
    <a href="../paintings/" class="on">Sand Paintings</a>
    <a href="../cooking/" >Kitchen</a>
  </div>
</div></nav>

<header class="hd">
  <div class="eyebrow">Sand &amp; Canvas</div>
  <h1>Sand <span class="grad">paintings</span></h1>
  <p class="lede">Built up in layers of coloured sand and acrylic — texture you can feel from across a room. Click any piece to view it full size.</p>
  <div class="count">12 pieces</div>
</header>

<main>
  <div class="gal" id="gal">
      <button class="gitem" data-full="../assets/art/art-02.jpg" aria-label="Sand painting 1"><img src="../assets/art/art-02-t.jpg" alt="Sand painting 1" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-01.jpg" aria-label="Sand painting 2"><img src="../assets/art/art-01-t.jpg" alt="Sand painting 2" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-04.jpg" aria-label="Sand painting 3"><img src="../assets/art/art-04-t.jpg" alt="Sand painting 3" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-05.jpg" aria-label="Sand painting 4"><img src="../assets/art/art-05-t.jpg" alt="Sand painting 4" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-06.jpg" aria-label="Sand painting 5"><img src="../assets/art/art-06-t.jpg" alt="Sand painting 5" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-12.jpg" aria-label="Sand painting 6"><img src="../assets/art/art-12-t.jpg" alt="Sand painting 6" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-09.jpg" aria-label="Sand painting 7"><img src="../assets/art/art-09-t.jpg" alt="Sand painting 7" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-08.jpg" aria-label="Sand painting 8"><img src="../assets/art/art-08-t.jpg" alt="Sand painting 8" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-03.jpg" aria-label="Sand painting 9"><img src="../assets/art/art-03-t.jpg" alt="Sand painting 9" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-07.jpg" aria-label="Sand painting 10"><img src="../assets/art/art-07-t.jpg" alt="Sand painting 10" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-10.jpg" aria-label="Sand painting 11"><img src="../assets/art/art-10-t.jpg" alt="Sand painting 11" loading="lazy" decoding="async"></button>
      <button class="gitem" data-full="../assets/art/art-11.jpg" aria-label="Sand painting 12"><img src="../assets/art/art-11-t.jpg" alt="Sand painting 12" loading="lazy" decoding="async"></button>
  </div>
  <a href="../" class="back">← Back to portfolio</a>
</main>

<footer>© <span id="yr"></span> Nikkat Afrin · <a href="../" style="color:var(--cy);text-decoration:none">nikkat-afrin.github.io</a></footer>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-x" id="lbX" aria-label="Close">✕</button>
  <button class="lb-p" id="lbP" aria-label="Previous">‹</button>
  <img id="lbI" alt="">
  <button class="lb-n" id="lbN" aria-label="Next">›</button>
  <div class="lb-c" id="lbC"></div>
</div>

<script>
document.getElementById('yr').textContent=new Date().getFullYear();
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');
  let w,h,st=[];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){w=c.width=innerWidth;h=c.height=innerHeight;
    st=[];const n=Math.min(280,Math.floor(w*h/6000));
    for(let i=0;i<n;i++)st.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.25,
      z:Math.random()*.7+.3,tw:Math.random()*6.28,sp:Math.random()*.02+.004});}
  function loop(){x.clearRect(0,0,w,h);
    for(const s of st){s.tw+=s.sp;const o=(.35+Math.abs(Math.sin(s.tw))*.65)*s.z;
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);
      x.fillStyle='rgba(234,244,255,'+o.toFixed(3)+')';x.fill();}
    requestAnimationFrame(loop);}
  addEventListener('resize',size);size();
  if(reduce){for(const s of st){x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);
    x.fillStyle='rgba(234,244,255,.5)';x.fill();}}else loop();
})();
(function(){
  const lb=document.getElementById('lb'),img=document.getElementById('lbI'),cap=document.getElementById('lbC');
  const g=document.getElementById('gal');
  let list=[...g.querySelectorAll('.gitem')],idx=0;
  function show(i){idx=(i+list.length)%list.length;
    img.src=list[idx].dataset.full;img.alt=list[idx].querySelector('img').alt;
    cap.textContent=(idx+1)+' / '+list.length;}
  g.addEventListener('click',e=>{const it=e.target.closest('.gitem');if(!it)return;
    show(list.indexOf(it));lb.classList.add('on');document.body.style.overflow='hidden';});
  const close=()=>{lb.classList.remove('on');document.body.style.overflow='';img.src=''};
  document.getElementById('lbX').onclick=close;
  document.getElementById('lbP').onclick=e=>{e.stopPropagation();show(idx-1)};
  document.getElementById('lbN').onclick=e=>{e.stopPropagation();show(idx+1)};
  lb.onclick=e=>{if(e.target===lb)close()};
  addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1);});
  let sx=0;
  lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;
    if(Math.abs(d)>50)show(idx+(d<0?1:-1));},{passive:true});
})();
</script>
<script src="../assets/js/assistant.js" defer></script>
</body>
</html>
